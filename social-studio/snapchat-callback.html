<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex"><meta name="referrer" content="no-referrer"><title>Returning to Social Studio</title></head>
<body><main><p id="msg">Returning to Social Studio on this computer…</p>
<script>
// Snapchat only accepts an https redirect, but Social Studio listens on this computer only. This page passes Snapchat's one-time code (the query string) to it and keeps nothing.
var target = 'http://127.0.0.1:5002/api/snapchat/callback';
if (location.search) location.replace(target + location.search);
else document.getElementById('msg').textContent = 'Nothing to pass on. Start the Snapchat connection from Social Studio.';
</script>
<noscript><p>JavaScript is needed to return to Social Studio.</p></noscript></main></body></html>
